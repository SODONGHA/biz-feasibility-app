<style>

#tip{display:none;position:fixed;z-index:60;width:340px;max-width:92vw;background:#fff;border:1px solid #b9c6e6;border-radius:12px;box-shadow:0 8px 28px rgba(20,30,70,.22);padding:12px 14px;font-size:12.5px;line-height:1.5}

#tip .tf{color:#98a0b3;font-size:11px;margin-top:6px}.tchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tchips button{border:1px solid #9db4ea;background:#fff;color:var(--blue);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}.tchips button:hover{background:var(--blue);color:#fff}

.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.mb{padding:14px 16px}.ta{width:100%;height:220px;font:12px/1.4 monospace;border:1px solid var(--line);border-radius:8px;padding:8px}
/* 보고서 */

</style></head><body>
<header class="app-header">
 <div class="hrow"><div class="logo">사업성 검토 · 원가분석<small>자동차/부품 신규사업 의사결정 도구 (초안 v0.1)</small></div>
  <input id="pn" class="pn in" type="text" data-path="meta.name" data-kind="text" placeholder="프로젝트명">
  <div class="acts"><select id="preset" class="pre"><option value="staria">예시: 스타리아 EV 어린이차</option><option value="pv7">예시: PV7 어린이차 (복사본)</option><option value="part">예시: 신규 부품 단품</option><option value="blank">빈 템플릿</option></select><button class="btn" id="btnNew">예시 불러오기</button><button class="btn" id="btnExport">💾 저장</button><button class="btn" id="btnLink">🔗 공유 링크</button><button class="btn" id="btnImport">📂 불러오기</button><button class="btn pri" id="btnPrint">🖨 인쇄</button></div></div>
 <div class="krow" id="topKpi"></div><nav class="tabs" id="nav"></nav>
</header>
<main id="view"></main>
<div id="tip"></div><div id="modal" style="display:none"></div>
<script>
/* ===== 계산 엔진 (엑셀 템플릿과 동일 로직) ===== */
const CATS=['기반차량','신규개발부품','구매부품','부자재·소모품'];
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const has=v=>v!==''&&v!==null&&v!==undefined&&isFinite(typeof v==='number'?v:parseFloat(String(v).replace(/,/g,'')));

function calc(S,adj){
  adj=adj||S.adj; const B=S.base,C=S.crit,R={};
  // 재료비
  R.mat={};CATS.forEach(c=>R.mat[c]=0);R.matRow=[];
  S.bom.forEach((r,i)=>{ if(has(r.qty)&&has(r.price)){const v=num(r.qty)*num(r.price)*(1+num(r.loss)); R.matRow[i]=v; if(r.cat in R.mat)R.mat[r.cat]+=v; R.matTot=(R.matTot||0)+v;} else R.matRow[i]=null;});
  R.matTot=R.matTot||0;
  // 공정
  R.procRow=[];R.procTot=0;
  S.proc.forEach((r,i)=>{ if(!r.name&&!has(r.min)&&!has(r.out)){R.procRow[i]=null;return;}
    const eff=num(r.eff)===0?1:num(r.eff);
    const v=r.type==='외주'?num(r.out):num(r.min)/60*(num(r.ppl)*num(r.rate)+num(r.eq))/eff; R.procRow[i]=v;R.procTot+=v;});
  // 물류
  R.logUnit=0;R.logFix=0;S.log.forEach(r=>{ if(r.type==='연고정')R.logFix+=num(r.amt); else R.logUnit+=num(r.amt);});
  // 투자/개발
  const dep=rows=>rows.map(r=>({amt:num(r.amt),yrs:num(r.yrs),dep:num(r.yrs)>0?num(r.amt)/num(r.yrs):0}));
  R.invRows=dep(S.inv);R.devRows=dep(S.dev);
  R.invTot=R.invRows.reduce((a,r)=>a+r.amt,0);R.devTot=R.devRows.reduce((a,r)=>a+r.amt,0);
  R.launchTot=S.launch.reduce((a,r)=>a+num(r.amt),0);
  R.noYrs=[...R.invRows,...R.devRows].filter(r=>r.amt>0&&!(r.yrs>0)).reduce((a,r)=>a+r.amt,0);
  const depAt=t=>[...R.invRows,...R.devRows].reduce((a,r)=>a+(r.yrs>=t?r.dep:0),0)*(1+adj.inv);
  // 연도별
  const Y=[];
  for(let t=1;t<=5;t++){
    const y={t}; y.units=num(B.vols[t-1])*(1+adj.vol);
    y.price=num(B.price)*(1+adj.price)*Math.pow(1-num(B.erosion),t-1);
    y.rev=y.units*y.price;
    y.mat=y.units*R.matTot*(1+adj.mat)*Math.pow(1-num(B.ve),t-1);
    y.proc=y.units*R.procTot*Math.pow(1+num(B.infl),t-1);
    y.log=y.units*R.logUnit*Math.pow(1+num(B.infl),t-1);
    y.cogs=y.mat+y.proc+y.log; y.gp=y.rev-y.cogs;
    y.fee=y.rev*num(B.fee);y.warr=y.rev*num(B.warr);y.sga=y.rev*num(B.sga);
    y.fixSga=num(B.fixed)*Math.pow(1+num(B.infl),t-1);
    y.fixLog=R.logFix*Math.pow(1+num(B.infl),t-1);
    y.dep=depAt(t); y.launch=t===1?R.launchTot:0;
    y.fixTot=y.fixSga+y.fixLog+y.dep+y.launch;
    y.ebit=y.gp-y.fee-y.warr-y.sga-y.fixTot;
    y.opm=y.rev?y.ebit/y.rev:0;
    y.tax=Math.max(0,y.ebit)*num(B.tax); y.ni=y.ebit-y.tax;
    const prev=t===1?0:Y[t-2].rev; y.dwc=(y.rev-prev)*num(B.wc);
    y.fcf=y.ni+y.dep+y.launch-y.dwc;
    Y.push(y);
  }
  R.Y=Y;
  R.invest=(R.invTot+R.devTot)*(1+adj.inv)+R.launchTot;
  const flows=[-R.invest,...Y.map(y=>y.fcf)];R.flows=flows;
  R.cum=[];flows.reduce((a,v,i)=>R.cum[i]=a+v,0);
  R.pv=flows.map((v,i)=>v/Math.pow(1+num(B.wacc),i));
  R.pvCum=[];R.pv.reduce((a,v,i)=>R.pvCum[i]=a+v,0);
  R.npv=R.pv.reduce((a,v)=>a+v,0);
  R.irr=irr(flows);
  const pb=cum=>{for(let t=1;t<=5;t++){if(cum[t-1]<0&&cum[t]>=0){const f=cum===R.cum?flows[t]:R.pv[t];return (t-1)+(-cum[t-1])/f;}}return null};
  R.pb=pb(R.cum);R.dpb=pb(R.pvCum);
  R.rev5=Y.reduce((a,y)=>a+y.rev,0);R.ebit5=Y.reduce((a,y)=>a+y.ebit,0);R.opm5=R.rev5?R.ebit5/R.rev5:0;
  // 대당(1년차)
  const y1=Y[0],u={};
  u.price=y1.price;u.matBase=R.mat['기반차량']*(1+adj.mat);u.matDev=R.mat['신규개발부품']*(1+adj.mat);
  u.matBuy=R.mat['구매부품']*(1+adj.mat);u.matSub=R.mat['부자재·소모품']*(1+adj.mat);
  u.mat=u.matBase+u.matDev+u.matBuy+u.matSub;
  // 구분 미지정 재료비도 포함
  u.mat=R.matTot*(1+adj.mat); u.matOther=u.mat-(u.matBase+u.matDev+u.matBuy+u.matSub);
  u.proc=R.procTot;u.log=R.logUnit;u.cost=u.mat+u.proc+u.log;u.gp=u.price-u.cost;
  u.fee=u.price*num(B.fee);u.warr=u.price*num(B.warr);u.sga=u.price*num(B.sga);u.var=u.fee+u.warr+u.sga;
  u.cm=u.gp-u.var;u.cmr=u.price?u.cm/u.price:0;R.u=u;
  R.bep=u.cm>0?y1.fixTot/u.cm:null;
  R.bepr=(R.bep!==null&&y1.units>0)?R.bep/y1.units:null;
  R.paybackUnits=u.cm>0?R.invest/u.cm:null;
  const den=1-num(B.fee)-num(B.warr)-num(B.sga)-num(C.opm);
  R.req=(y1.units>0&&den>0)?((y1.cogs+y1.fixTot)/y1.units)/den:null;
  R.reqUp=(R.req!==null&&y1.price>0)?R.req/y1.price-1:null;
  // 판정
  const ck=[
   {k:'NPV',label:'NPV (순현재가치)',tgt:num(C.npv),act:R.npv,ok:R.npv>=num(C.npv),f:'won',dir:'≥'},
   {k:'IRR',label:'IRR (내부수익률)',tgt:num(C.irr),act:R.irr,ok:R.irr!==null&&R.irr>=num(C.irr),f:'pct',dir:'≥'},
   {k:'회수기간',label:'투자회수기간(년)',tgt:num(C.pb),act:R.pb,ok:R.pb!==null&&R.pb<=num(C.pb),f:'yr',dir:'≤'},
   {k:'영업이익률',label:'5년 평균 영업이익률',tgt:num(C.opm),act:R.opm5,ok:R.opm5>=num(C.opm),f:'pct',dir:'≥'},
   {k:'공헌이익률',label:'대당 공헌이익률',tgt:num(C.cm),act:u.cmr,ok:u.cmr>=num(C.cm),f:'pct',dir:'≥'},
   {k:'BEP 안전율',label:'BEP ÷ 1년차 계획대수',tgt:num(C.bep),act:R.bepr,ok:R.bepr!==null&&R.bepr<=num(C.bep),f:'pct',dir:'≤'}];
  R.checks=ck;R.cnt=ck.filter(c=>c.ok).length;
  R.verdict=(ck[0].ok&&ck[1].ok&&R.cnt>=5)?'GO':(ck[0].ok&&R.cnt>=4)?'CONDITIONAL':'NOGO';

  return (lo+hi)/2;
}

  const rows=S[key].map((r,i)=>`<tr>${T.cols.map(c=>`<td>${inp(`${key}.${i}.${c.k}`,c.t,{o:c.o})}</td>`).join('')}${T.calc?`<td class="calc"><span data-calc="${key}.${i}">-</span></td>`:''}<td class="act"><button class="ib" data-dup="${key}.${i}" title="행 복제">⧉</button><button class="ib del" data-del="${key}.${i}" title="행 삭제">✕</button></td></tr>`).join('');
  return `<div class="card"><div class="ch"><h3>${T.title}</h3><div class="sum" data-total="${key}"></div></div><div class="tw"><table class="tb"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div><button class="btn sm" data-add="${key}">＋ 행 추가</button></div>`}

function ticks(min,max,n=5){if(min===max)max=min+1;const sp=max-min,s0=sp/n,mg=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mg,st=(nm<1.5?1:nm<3?2:nm<7?5:10)*mg;const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st,t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(v);return t}
function frame(W,H,body){return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR,Malgun Gothic,sans-serif">${body}</svg>`}
function axisY(t,y,m,W){return t.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#555':COL.lg}" stroke-width="${v===0?1.2:1}"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#666">${kr(v)}</text>`).join('')}
function barSVG(){const W=560,H=270,m={l:56,r:10,t:26,b:30};const cats=R.Y.map(y=>y.t+'년차');const sr=[{n:'매출액',c:COL.sky,v:R.Y.map(y=>y.rev)},{n:'영업이익',c:COL.navy,v:R.Y.map(y=>y.ebit)},{n:'FCF',c:COL.teal,v:R.Y.map(y=>y.fcf)}];
 const all=sr.flatMap(s=>s.v).concat([0]);const t=ticks(Math.min(...all),Math.max(...all));const y=v=>m.t+(H-m.t-m.b)*(1-(v-t[0])/(t[t.length-1]-t[0]));
 const gw=(W-m.l-m.r)/cats.length,bw=gw*0.8/sr.length;let b=axisY(t,y,m,W);
 cats.forEach((c,i)=>{sr.forEach((s,j)=>{const v=s.v[i],x=m.l+gw*i+gw*0.1+bw*j;b+=`<rect x="${x.toFixed(1)}" y="${Math.min(y(v),y(0)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(1,Math.abs(y(v)-y(0))).toFixed(1)}" fill="${s.c}" rx="2"/>`});b+=`<text x="${m.l+gw*i+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#444">${c}</text>`});
 sr.forEach((s,j)=>{b+=`<rect x="${m.l+j*82}" y="6" width="10" height="10" fill="${s.c}" rx="2"/><text x="${m.l+j*82+14}" y="15" font-size="11" fill="#444">${s.n}</text>`});return frame(W,H,b)}
function cumSVG(){const W=560,H=270,m={l:56,r:16,t:22,b:30};const v=R.cum;const t=ticks(Math.min(...v,0),Math.max(...v,0));const y=q=>m.t+(H-m.t-m.b)*(1-(q-t[0])/(t[t.length-1]-t[0]));const x=i=>m.l+(W-m.l-m.r)*i/5;
 let b=axisY(t,y,m,W);const pts=v.map((q,i)=>`${x(i).toFixed(1)},${y(q).toFixed(1)}`).join(' ');
 b+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(5)},${y(0)}" fill="${COL.blue}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${COL.blue}" stroke-width="2.5"/>`;
 v.forEach((q,i)=>{b+=`<circle cx="${x(i)}" cy="${y(q)}" r="3.5" fill="${q<0?COL.red:COL.green}"/><text x="${x(i)}" y="${y(q)+(q<0?16:-8)}" text-anchor="middle" font-size="10" fill="#333">${kr(q)}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#444">${i}년차</text>`});
 if(R.pb!==null){const px=x(R.pb);b+=`<line x1="${px}" x2="${px}" y1="${m.t}" y2="${H-m.b}" stroke="${COL.green}" stroke-dasharray="4 3"/><text x="${px+4}" y="${m.t+10}" font-size="11" fill="${COL.green}" font-weight="700">회수 ${R.pb.toFixed(1)}년</text>`}
 else b+=`<text x="${W-m.r}" y="${m.t+10}" text-anchor="end" font-size="11" fill="${COL.red}" font-weight="700">5년 내 회수 불가</text>`;return frame(W,H,b)}
function wfSVG(){const u=R.u;const it=[['판매단가',u.price,'t'],['기반차량',-u.matBase,'d'],['부품·자재',-(u.mat-u.matBase),'d'],['가공비',-u.proc,'d'],['물류비',-u.log,'d'],['수수료·보증·판관',-u.var,'d'],['공헌이익',u.cm,'t']];
 const W=560,H=290,m={l:56,r:10,t:22,b:42};let run=0,b='';const lv=[];it.forEach(([l,v,t],i)=>{if(t==='t'){lv.push([0,v,l,v,t]);run=v}else{lv.push([run,run+v,l,v,t]);run+=v}});lv[0][0]=0;
 const lo=Math.min(0,...lv.map(a=>Math.min(a[0],a[1]))),hi=Math.max(...lv.map(a=>Math.max(a[0],a[1])));const t=ticks(lo,hi);const y=q=>m.t+(H-m.t-m.b)*(1-(q-t[0])/(t[t.length-1]-t[0]));b+=axisY(t,y,m,W);
 const gw=(W-m.l-m.r)/it.length;lv.forEach((a,i)=>{const x=m.l+gw*i+gw*.14,w=gw*.72;const top=Math.max(a[0],a[1]),bot=Math.min(a[0],a[1]);const col=a[4]==='t'?(i===0?COL.navy:(a[3]>=0?COL.green:COL.red)):COL.amber;
  b+=`<rect x="${x}" y="${y(top)}" width="${w}" height="${Math.max(1.5,y(bot)-y(top))}" fill="${col}" rx="2"/><text x="${x+w/2}" y="${y(top)-4}" text-anchor="middle" font-size="10" fill="#333">${kr(a[3])}</text>`;
  const lab=a[2],parts=lab.length>5?[lab.slice(0,Math.ceil(lab.length/2)),lab.slice(Math.ceil(lab.length/2))]:[lab];parts.forEach((p,k)=>b+=`<text x="${x+w/2}" y="${H-26+k*12}" text-anchor="middle" font-size="10" fill="#444">${p}</text>`)});return frame(W,H,b)}
function bepSVG(){const W=560,H=270,m={l:56,r:16,t:22,b:34};const y1=R.Y[0],cm=R.u.cm,fx=y1.fixTot;const mx=Math.max(y1.units*1.8,(R.bep||0)*1.4,10);const pf=q=>q*cm-fx;
 const vals=[pf(0),pf(mx)];const t=ticks(Math.min(...vals,0),Math.max(...vals,0));const y=q=>m.t+(H-m.t-m.b)*(1-(q-t[0])/(t[t.length-1]-t[0]));const x=q=>m.l+(W-m.l-m.r)*q/mx;
 let b=axisY(t,y,m,W);b+=`<polyline points="${x(0)},${y(pf(0))} ${x(mx)},${y(pf(mx))}" fill="none" stroke="${COL.blue}" stroke-width="2.5"/>`;
 [0,.25,.5,.75,1].forEach(f=>b+=`<text x="${x(mx*f)}" y="${H-16}" text-anchor="middle" font-size="10" fill="#555">${fnum(mx*f)}</text>`);b+=`<text x="${W/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="#777">연간 판매량 (${S.meta.unit})</text>`;
 b+=`<line x1="${x(y1.units)}" x2="${x(y1.units)}" y1="${m.t}" y2="${H-m.b}" stroke="${COL.navy}" stroke-dasharray="4 3"/><text x="${Math.min(x(y1.units)+5,W-150)}" y="${m.t+10}" font-size="11" fill="${COL.navy}">1년차 계획 ${fnum(y1.units)}${S.meta.unit} → 영업이익 ${kr(pf(y1.units))}</text><circle cx="${x(y1.units)}" cy="${y(pf(y1.units))}" r="4.5" fill="${pf(y1.units)<0?COL.red:COL.green}"/>`;
 if(R.bep!==null&&R.bep<=mx)b+=`<circle cx="${x(R.bep)}" cy="${y(0)}" r="5" fill="${COL.amber}" stroke="#fff"/><text x="${x(R.bep)-8}" y="${y(0)+20}" text-anchor="end" font-size="11" font-weight="700" fill="#8a5a00">손익분기 ${fnum(R.bep)}${S.meta.unit}</text>`;
 else if(R.bep===null)b+=`<text x="${W/2}" y="${m.t+26}" text-anchor="middle" font-size="12" fill="${COL.red}">대당 공헌이익이 음수 - 팔수록 손실</text>`;return frame(W,H,b)}
function tornadoData(){const base=R.npv,items=[['판매단가','price'],['판매대수','vol'],['재료비','mat'],['투자·개발비','inv']];

function torSVG(small){const W=560,H=small?210:230,m={l:92,r:20,t:26,b:26};const base=R.npv,d=tornadoData();const all=d.flatMap(o=>[o.lo,o.hi]).concat([base]);const t=ticks(Math.min(...all),Math.max(...all),4);const x=v=>m.l+(W-m.l-m.r)*(v-t[0])/(t[t.length-1]-t[0]);const bh=(H-m.t-m.b)/d.length*.6;
 let b=t.map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${COL.lg}"/><text x="${x(v)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#666">${kr(v)}</text>`).join('');
 d.forEach((o,i)=>{const cy=m.t+(H-m.t-m.b)/d.length*(i+.5);const a=Math.min(o.lo,o.hi),z=Math.max(o.lo,o.hi);b+=`<text x="${m.l-8}" y="${cy+4}" text-anchor="end" font-size="11" fill="#333">${o.l}</text>`;
  const seg=(v1,v2,c)=>`<rect x="${x(Math.min(v1,v2))}" y="${cy-bh/2}" width="${Math.max(1,Math.abs(x(v2)-x(v1)))}" height="${bh}" fill="${c}" rx="2"/>`;

 b+=`<line x1="${x(base)}" x2="${x(base)}" y1="${m.t-4}" y2="${H-m.b}" stroke="#222" stroke-width="1.5"/><text x="${x(base)}" y="${m.t-8}" text-anchor="middle" font-size="10" fill="#222">현재 NPV ${kr(base)}</text>`;return frame(W,H,b)}

 <div class="rule"><b>알아두세요</b><br>· 링크 안에 입력 내용이 <b>들어 있습니다</b>(서버에 저장되지 않음). 링크를 받은 사람은 누구나 내용을 볼 수 있으니 신뢰하는 사람에게만 보내세요.<br>· 링크는 <b>그 시점의 복사본</b>입니다. 이후 수정하면 새 링크를 다시 만들어야 합니다.<br>· 받은 사람이 고친 내용은 그 사람의 화면에만 반영됩니다.</div>`)}
function showShared(){let b=$('#sharedBar');if(!b){b=document.createElement('div');b.id='sharedBar';b.className='warn noprint';b.style.cssText='max-width:1280px;margin:12px auto 0;';$('main').before(b)}
 b.innerHTML='🔗 <b>공유 링크로 열린 화면</b>입니다. 내 브라우저의 기존 저장 내용은 그대로이며, 이 화면에서 수정한 내용은 저장되지 않습니다. <button class="btn sm" id="btnKeep">이 내용을 내 브라우저에 저장</button>'}
function keepShared(){SHARED=false;try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}const b=$('#sharedBar');if(b)b.remove();persist();toast('내 브라우저에 저장했습니다')}
async function loadFromHash(){const m=location.hash.match(/^#d=(.+)$/);if(!m)return;try{const o=await unpackState(m[1]);if(!o.base||!o.bom)throw 0;o.adj={price:0,vol:0,mat:0,inv:0};if(!o.scen)o.scen=defaultScen();if(!o.meta.unit)o.meta.unit='대';S=o;SHARED=true;TAB='dash';buildNav();view();showShared()}catch(e){toast('공유 링크를 읽지 못했습니다 (링크가 잘렸을 수 있습니다)')}}
function init(){tipEl=$('#tip');buildNav();view();if(window.claude&&window.claude.use){const b=$('#btnLink');if(b)b.style.display='none'}teamInit();loadFromHash()}
document.addEventListener('DOMContentLoaded',init);
/* ===== 팀 협업 (공유 데이터 · 검토 의견 · 버전) ===== */
const TEAM={db:null,user:null,myId:null,exists:false,ready:false,syncOn:true,lastJson:'',pending:null,writing:false,t:null,meta:null,reviews:[],snaps:[],names:{},err:null,readOnly:false,remoteNewer:null,toast:''};
const STANCE={go:['추진 찬성','go'],cond:['조건부','cond'],nogo:['반대','nogo']};
function shareable(){const o=clone(S);delete o.adj;return o}
async function teamInit(){
 if(!(window.claude&&window.claude.use))return;
 try{TEAM.user=await claude.use('user');TEAM.db=await claude.use('db')}catch(e){}
 if(!TEAM.db){return}
 try{TEAM.myId=TEAM.user?await TEAM.user.id():null}catch(e){}
 try{TEAM.canWrite=TEAM.user&&TEAM.user.can?await TEAM.user.can('data.write'):null}catch(e){}
 if(TEAM.canWrite===false)TEAM.readOnly=true;
 const fail=e=>{TEAM.err=(e&&e.code)||'unavailable';teamUI()};
 try{
  TEAM.projRef=TEAM.db.doc('shared/project');
  TEAM.projRef.onSnapshot(onProj,fail);
  TEAM.db.collection('reviews').onSnapshot(s=>{TEAM.reviews=s.docs.map(d=>({id:d.id,...d.data()}));namesThen(renderTeamParts)},fail);
  TEAM.db.collection('snapshots').orderBy('at','desc').limit(20).onSnapshot(s=>{TEAM.snaps=s.docs.map(d=>({id:d.id,...d.data()}));namesThen(renderTeamParts)},fail);
 }catch(e){fail(e)}
 teamUI();
}
async function namesThen(fn){
 try{const ids=[...new Set([...TEAM.reviews.map(r=>r.id),...TEAM.snaps.map(r=>r.by),TEAM.meta&&TEAM.meta.by].filter(Boolean))];
  if(ids.length&&TEAM.user&&TEAM.user.profiles){const ps=await TEAM.user.profiles(ids);ids.forEach(i=>{TEAM.names[i]=(ps[i]&&ps[i].name)||''})}}catch(e){}
 fn();update_top()}
const nm=id=>id===TEAM.myId?(TEAM.names[id]||'나')+(TEAM.names[id]?' (나)':''):(TEAM.names[id]||'팀원');
function onProj(snap){
 TEAM.ready=true;TEAM.exists=snap.exists;TEAM.err=null;
 if(!snap.exists){teamUI();return}
 const d=snap.data();TEAM.meta={by:d.by,at:d.at};
 if(d.json===TEAM.lastJson){teamUI();namesThen(()=>{});return}
 if(!TEAM.syncOn){TEAM.remoteNewer=d.json;teamUI();return}
 applyRemote(d.json);namesThen(()=>{teamUI()})}
function applyRemote(json){
 const a=document.activeElement;
 if(a&&a.matches&&a.matches('input[data-path],textarea,select[data-path]')){TEAM.pending=json;return}
 try{const o=JSON.parse(json);if(!o.base||!o.bom)return;o.adj=S.adj;if(!o.scen)o.scen=defaultScen();S=o;TEAM.lastJson=JSON.stringify(shareable());TEAM.pending=null;TEAM.remoteNewer=null;toast('팀원의 수정 내용이 반영되었습니다');view(1)}catch(e){}}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(TEAM.pending&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input[data-path],textarea')))applyRemote(TEAM.pending)},300)});
function teamPush(){
 if(!TEAM.db||!TEAM.exists||!TEAM.syncOn||TEAM.readOnly)return;
 if(JSON.stringify(shareable())===TEAM.lastJson)return;
 clearTimeout(TEAM.t);TEAM.t=setTimeout(doPush,1200)}
async function doPush(force){
 if(TEAM.writing){TEAM.t=setTimeout(doPush,600);return}
 const j=JSON.stringify(shareable());if(j===TEAM.lastJson&&!force)return;
 const prev=TEAM.lastJson;TEAM.writing=true;TEAM.lastJson=j;
 try{await TEAM.projRef.set({json:j,by:TEAM.myId||'',at:new Date().toISOString()});TEAM.err=null;TEAM.exists=true}
 catch(e){TEAM.lastJson=prev;TEAM.err=(e&&e.code)||'unavailable';if(TEAM.err==='invalid_argument')TEAM.readOnly=true}
 TEAM.writing=false;teamUI()}
async function startShare(){await doPush(true);toast('팀 공유를 시작했습니다. 이제 팀원이 같은 데이터를 봅니다.')}
async function saveSnapshot(){const name=($('#snName').value||'').trim()||('버전 '+new Date().toLocaleString('ko-KR'));
 try{await TEAM.db.collection('snapshots').add({name,json:JSON.stringify(shareable()),by:TEAM.myId||'',at:new Date().toISOString(),npv:Math.round(R.npv),verdict:R.verdict,price:num(S.base.price)});$('#snName').value='';toast('버전을 저장했습니다')}catch(e){toast('저장 실패: 권한(편집자/기여자)이 필요합니다')}}
function restoreSnapshot(id){const s=TEAM.snaps.find(x=>x.id===id);if(!s)return;try{const o=JSON.parse(s.json);o.adj=S.adj;S=o;view(1);toast('"'+s.name+'" 버전을 불러왔습니다');if(TEAM.syncOn&&TEAM.exists)teamPush()}catch(e){}}
async function saveReview(){
 if(!TEAM.db||!TEAM.myId){toast('로그인 상태에서만 저장됩니다');return}
 const st=(document.querySelector('input[name=stance]:checked')||{}).value;if(!st){toast('의견(추진/조건부/반대)을 선택하세요');return}
 try{await TEAM.db.doc('reviews/'+TEAM.myId).set({stance:st,comment:($('#rvText').value||'').slice(0,2000),at:new Date().toISOString(),verdict:R.verdict,npv:Math.round(R.npv),cnt:R.cnt});toast('검토 의견을 저장했습니다')}catch(e){toast('저장 실패: 기여자(Contributor) 이상 권한이 필요합니다')}}
async function delReview(){try{await TEAM.db.doc('reviews/'+TEAM.myId).delete();toast('내 의견을 삭제했습니다')}catch(e){}}
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200)}
/* --- 화면 --- */
const tsx=iso=>{try{return new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function teamHTML(){const my=TEAM.reviews.find(r=>r.id===TEAM.myId)||{};
 return `<div class="help"><b>팀 검토</b> — 같은 데이터를 팀원이 함께 보고, 각자 의견을 남깁니다.<br><span>① 한 사람이 "공유 시작"을 누르면 입력 내용이 팀 공유 저장소에 올라갑니다 ② 팀원은 이 페이지를 열기만 하면 같은 데이터가 보이고, 수정하면 모두에게 반영됩니다 ③ 각자 <b>검토 의견</b>을 남기면 아래에 모아서 보입니다. 동시에 같은 칸을 수정하면 마지막 저장이 우선되니, 큰 수정 전에는 "버전 저장"을 해 두세요.</span></div>
 <div class="card"><div class="ch"><h3>공유 상태</h3></div><div id="tmStatus"></div></div>
 <div class="grid2"><div class="card"><div class="ch"><h3>내 검토 의견</h3><span class="sub">현재 판정: ${VERD[R.verdict].l}</span></div>
  <div class="stances">${Object.entries(STANCE).map(([k,[l]])=>`<label class="st st-${k}"><input type="radio" name="stance" value="${k}"${my.stance===k?' checked':''}> ${l}</label>`).join('')}</div>
  <textarea id="rvText" class="ta" style="height:110px" placeholder="검토 의견·우려사항·확인이 필요한 가정을 적어 주세요 (예: 기반차량 매입가 협상 근거 필요)">${esc(my.comment||'')}</textarea>
  <div class="btns" style="margin-top:6px"><button class="btn pri" id="btnRv">의견 저장</button><button class="btn sm" id="btnRvDel">내 의견 삭제</button></div></div>
 <div class="card"><div class="ch"><h3>팀 검토 현황</h3><span class="sub">검토 대상 인원 <input class="in r" style="width:46px;display:inline-block" type="text" data-path="meta.teamSize" data-kind="num" value="${S.meta.teamSize||4}">명</span></div><div id="tmTally"></div></div></div>
 <div class="card"><div class="ch"><h3>검토 의견 모음</h3></div><div id="tmReviews"></div></div>
 <div class="card"><div class="ch"><h3>버전 저장 / 복원</h3><span class="sub">큰 수정 전후로 저장해 두면 되돌릴 수 있습니다</span></div>
  <div class="btns" style="margin:0 0 8px"><input id="snName" class="in" style="max-width:300px" type="text" placeholder="버전 이름 (예: 협력사 견적 반영 전)"><button class="btn pri" id="btnSn">현재 내용 저장</button></div><div id="tmSnaps"></div></div>`}
function teamUI(){const el=$('#tmStatus');update_top();if(!el)return;let h='';
 if(!TEAM.db)h='<div class="warn">팀 기능이 꺼져 있습니다. 이 파일을 단독으로 열었거나 로그인되지 않은 상태입니다. <b>claude.ai의 게시 페이지(공유 링크)</b>에서 열어야 팀 공유·검토 의견이 작동합니다.</div>';
 else{
  if(TEAM.err)h+=`<div class="warn">연결 문제가 있습니다 (${esc(TEAM.err)}). ${TEAM.readOnly?'':'잠시 후 다시 시도됩니다.'}</div>`;
  if(TEAM.readOnly)h+='<div class="warn">현재 계정은 <b>보기 전용</b> 권한입니다. 수정·의견 저장이 되지 않습니다. 소유자가 공유 메뉴에서 권한을 <b>기여자(Contributor) 또는 편집자</b>로 올려야 합니다.</div>';
  if(!TEAM.ready)h+='<div class="sub">공유 저장소에 연결 중…</div>';
  else if(!TEAM.exists)h+=`<p>아직 팀 공유 데이터가 없습니다. 지금 화면의 입력 내용을 올려서 <b>팀 공유를 시작</b>할까요?</p><button class="btn pri" id="btnStart"${TEAM.readOnly?' disabled':''}>현재 내용으로 팀 공유 시작</button>`;
  else h+=`<p><span class="chip go">팀 공유 중</span> 마지막 수정: <b>${esc(nm(TEAM.meta&&TEAM.meta.by))}</b> · ${tsx(TEAM.meta&&TEAM.meta.at)} ${TEAM.writing?'<span class="sub">(저장 중…)</span>':''}</p>
   <label class="sw"><input type="checkbox" id="syncTg"${TEAM.syncOn?' checked':''}> 팀 동기화 켜기 <span class="sub">(끄면 이 화면에서만 실험하고 팀 데이터는 바뀌지 않습니다)</span></label>
   ${TEAM.remoteNewer?'<div class="warn">동기화가 꺼진 동안 팀 데이터가 바뀌었습니다. <button class="btn sm" id="btnPull">팀 최신 내용 불러오기</button></div>':''}`}
 el.innerHTML=h}
function update_top(){const c=$('#teamChip');if(!c)return;if(!TEAM.db){c.innerHTML='';return}const n=TEAM.reviews.length,t=num(S.meta.teamSize)||4;c.innerHTML=`<span class="chip ${TEAM.exists?'go':'warnc'}" data-tab="team" style="cursor:pointer">👥 ${TEAM.exists?'팀 공유 중':'공유 전'} · 검토 ${n}/${t}</span>`}
function renderTeamParts(){
 const t=num(S.meta.teamSize)||4;const cnt={go:0,cond:0,nogo:0};TEAM.reviews.forEach(r=>{if(cnt[r.stance]!==undefined)cnt[r.stance]++});
 const ty=$('#tmTally');if(ty)ty.innerHTML=`<div class="kpis"><div class="kpi"><div class="kl">검토 완료</div><div class="kv">${TEAM.reviews.length} / ${t}</div><div class="ks">미검토 ${Math.max(0,t-TEAM.reviews.length)}명</div></div><div class="kpi"><div class="kl">찬성</div><div class="kv" style="color:#1E7B3A">${cnt.go}</div></div><div class="kpi"><div class="kl">조건부</div><div class="kv" style="color:#8A5A00">${cnt.cond}</div></div><div class="kpi"><div class="kl">반대</div><div class="kv" style="color:#B3261E">${cnt.nogo}</div></div></div>`;
 const rv=$('#tmReviews');if(rv)rv.innerHTML=reviewsHTML();
 const sn=$('#tmSnaps');if(sn)sn.innerHTML=TEAM.snaps.length?`<table class="tb"><thead><tr><th>이름</th><th>저장자</th><th>시각</th><th>판정</th><th>NPV</th><th></th></tr></thead><tbody>${TEAM.snaps.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(nm(s.by))}</td><td>${tsx(s.at)}</td><td><span class="chip ${(VERD[s.verdict]||{}).c}">${((VERD[s.verdict]||{l:'-'}).l).split(' ')[0]}</span></td><td class="r">${krw(s.npv)}</td><td><button class="btn sm" data-rs="${s.id}">불러오기</button></td></tr>`).join('')}</tbody></table>`:'<div class="sub">저장된 버전이 없습니다.</div>';
 if(TAB==='report'&&$('#r_rev'))$('#r_rev').innerHTML=reviewsHTML(true)}
function reviewsHTML(rep){if(!TEAM.reviews.length)return '<div class="sub">아직 등록된 검토 의견이 없습니다.</div>';
 return TEAM.reviews.slice().sort((a,b)=>(a.at||'')<(b.at||'')?1:-1).map(r=>{const st=STANCE[r.stance]||['-',''];const stale=(r.npv!==undefined&&Math.round(R.npv)!==r.npv)?'<span class="tag bad">검토 이후 수치 변경됨</span>':'';
  return `<div class="rvi"><div class="rvh"><span class="chip ${st[1]}">${st[0]}</span> <b>${esc(nm(r.id))}</b> <span class="sub">${tsx(r.at)} · 검토 시점 판정 ${(VERD[r.verdict]||{l:'-'}).l}, NPV ${krw(r.npv)}</span> ${stale}</div><div class="rvc2">${esc(r.comment||'(의견 없음)').replace(/\n/g,'<br>')}</div></div>`}).join('')}
</script></body></html>
